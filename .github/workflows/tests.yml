name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests scripts
      - run: python scripts/build_rating_languages.py --check
      - run: node scripts/test_rating_pages.mjs
      - run: python -m pytest -W error
      - run: python -m build --no-isolation
      - name: Install wheel in a separate environment and run outside the repository
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/f1quali-wheel"
          "$RUNNER_TEMP/f1quali-wheel/bin/python" -m pip install -r requirements.lock
          "$RUNNER_TEMP/f1quali-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/f1quali-wheel/bin/f1-quali" demo --output "$RUNNER_TEMP/f1quali-demo"
          "$RUNNER_TEMP/f1quali-wheel/bin/f1-quali" demo --method v6 --output "$RUNNER_TEMP/f1quali-demo-v6"
